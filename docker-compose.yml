services:
  postgres:
    image: postgres:16-alpine
    container_name: mdh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mdh3d}
      POSTGRES_USER: ${POSTGRES_USER:-mdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdh123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdh} -d ${POSTGRES_DB:-mdh3d}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mdh-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mdh-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: mdh-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-mdh}:${POSTGRES_PASSWORD:-mdh123}@postgres:5432/${POSTGRES_DB:-mdh3d}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-mdh}:${POSTGRES_PASSWORD:-mdh123}@postgres:5432/${POSTGRES_DB:-mdh3d}?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAILHOG_HOST: mailhog
      MAILHOG_SMTP_PORT: 1025
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - product-media:/app/uploads/products
      - model-media:/app/uploads/stl
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (res) => { if (res.statusCode >= 400) process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  postgres-data:
  redis-data:
  product-media:
  model-media:
