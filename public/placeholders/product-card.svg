<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MDH 3D - imagem do produto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071016"/>
      <stop offset="0.52" stop-color="#0f2633"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="260" y1="285" x2="925" y2="890" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#67E8F9" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" rx="56" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <path d="M150 820H1050" stroke="#67E8F9" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M250 300H950V505H250V300Z" stroke="url(#line)" stroke-width="34" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M360 505V650H840V505" stroke="url(#line)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M515 650H685L745 780H455L515 650Z" fill="#0B1722" stroke="url(#line)" stroke-width="30" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M520 780H680V855H520V780Z" fill="#071016" stroke="#34D399" stroke-width="24" stroke-linejoin="round"/>
  <path d="M425 905H775" stroke="#F8FAFC" stroke-opacity="0.72" stroke-width="18" stroke-linecap="round"/>
  <path d="M480 960H720" stroke="#F8FAFC" stroke-opacity="0.44" stroke-width="12" stroke-linecap="round"/>
  <circle cx="330" cy="402" r="28" fill="#34D399"/>
  <circle cx="870" cy="402" r="28" fill="#A78BFA"/>
  <text x="600" y="190" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="8">MDH 3D</text>
  <text x="600" y="1040" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="5">IMAGEM DO PRODUTO</text>
</svg>
