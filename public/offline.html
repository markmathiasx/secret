<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1824" />
  <title>Sem conexão — MDH 3D Store</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1824;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --cyan: #67e8f9;
      --text: rgba(255,255,255,0.85);
      --muted: rgba(255,255,255,0.45);
      --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(103,232,249,0.1);
      border: 1px solid rgba(103,232,249,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { width: 32px; height: 32px; color: var(--cyan); }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.6;
      margin: 0 auto 2rem;
    }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 280px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      border: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--cyan); color: #0d1824; }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .brand {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
    </svg>
  </div>

  <h1>Você está offline</h1>
  <p>Sem conexão com a internet. Verifique seu Wi-Fi ou dados móveis e tente novamente.</p>

  <div class="actions">
    <button class="btn btn-primary" onclick="tryReload()" type="button">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Tentar novamente
    </button>
    <a class="btn btn-secondary" href="/" onclick="return navigator.onLine">
      Ir para o início
    </a>
  </div>

  <p class="brand">MDH 3D Store · Rio de Janeiro</p>

  <script>
    function tryReload() {
      window.location.reload();
    }
    // Auto-reload when connection is restored
    window.addEventListener('online', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
