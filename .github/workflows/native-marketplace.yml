name: Native marketplace checks
on:
  pull_request:
    paths: ['apps/mdh_mobile/**', 'services/marketplace-api/**', '.github/workflows/native-marketplace.yml']
  push:
    branches: [main, 'codex/native-marketplace-20261007', 'codex/mobile-storefront-redesign-*']
    paths: ['apps/mdh_mobile/**', 'services/marketplace-api/**', '.github/workflows/native-marketplace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marketplace-api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mdh_api_test
          POSTGRES_USER: mdh_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/marketplace-api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://mdh_test:ci-disposable-only@127.0.0.1:5432/mdh_api_test
      - run: npm audit --omit=dev --audit-level=low
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mdh_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
  android-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mdh_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate release configuration
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - run: flutter pub get
      - name: Build signed Android App Bundle
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: mdh-mobile-android-release
          path: apps/mdh_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  ios-compile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    environment: release
    defaults:
      run:
        working-directory: apps/mdh_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate API origin
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: test -n "$API_BASE_URL"
      - run: flutter pub get
      - name: Compile iOS without distribution signature
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: mdh-mobile-ios-unsigned
          path: apps/mdh_mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
