name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build

  storefront-media:
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: (npm run start &) && npx wait-on http://127.0.0.1:3000
      - run: npm run validate:assets
      - run: npm run test:images
