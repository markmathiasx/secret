name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mdh_ci?schema=public"
  NEXTAUTH_SECRET: "ci-placeholder-secret-32chars-ok-for-build"
  NEXT_PUBLIC_SITE_URL: "https://mdh3d.com.br"
  ADMIN_PASSWORD_HASH: "ci-placeholder-not-used-in-build"
  ADMIN_SESSION_SECRET: "ci-placeholder-admin-session-secret-32chars"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build

  smoke-prod:
    runs-on: ubuntu-latest
    needs: quality-gates
    # Only run against live production after a merge to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test production URL (non-blocking)
        run: npm run test:smoke:prod
        continue-on-error: true
        env:
          SMOKE_BASE_URL: "https://mdh3d.com.br"
