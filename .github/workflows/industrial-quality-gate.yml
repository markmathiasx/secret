name: Industrial Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  industrial-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
      - run: npm run build
      - run: npm run commerce-os:score
      - run: npm run verify:industrial
      - run: npm audit --audit-level=low
