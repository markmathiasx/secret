name: production-gates

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      VERCEL_ORG_ID: team_bu1enqIdDCfFt5c3gRRE9Z4P
      VERCEL_PROJECT_ID: prj_2r7sVOUhfP3FQpNE5Aoocyg5pXDo
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BASE_URL: "https://www.mdh3d.com.br"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Industrial release gate
        run: npm run industrial:v6:gate
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"

      - name: Install Vercel CLI
        run: npm i -g vercel@57.0.0

      - name: Deploy, smoke test, and rollback on failure
        run: node scripts/production/vercel-deploy-with-smoke-and-rollback.mjs
