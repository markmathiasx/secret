name: production-gates

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERCEL_ORG_ID: team_bu1enqIdDCfFt5c3gRRE9Z4P
      VERCEL_PROJECT_ID: prj_2r7sVOUhfP3FQpNE5Aoocyg5pXDo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm i -g wait-on vercel@latest
      - run: (npm run start &) && wait-on http://127.0.0.1:3000
      - run: npm run validate:assets
      - name: Image regression tests (non-blocking)
        run: npm run test:images
        continue-on-error: true
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
