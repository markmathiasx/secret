name: Production Gates - Status Checks Obrigatórios

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  # 1. TypeScript Type Checking
  typecheck:
    runs-on: ubuntu-latest
    name: TypeScript Type Check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
        env:
          SKIP_ENV_VALIDATION: true

  # 2. ESLint & Code Quality
  lint:
    runs-on: ubuntu-latest
    name: Code Quality (ESLint)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --format json --output-file eslint-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json

  # 3. Build Verification
  build:
    runs-on: ubuntu-latest
    name: Production Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next

  # 4. Playwright E2E Tests (CRITICAL for checkout)
  playwright:
    runs-on: ubuntu-latest
    name: Playwright E2E Tests
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # 5. Security Audit
  security:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate || exit 1

  # 6. Database Migration Check
  migrations:
    runs-on: ubuntu-latest
    name: Prisma Migration Check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma format --check
      - run: npx prisma validate

  # Final Status Check
  status-gates:
    runs-on: ubuntu-latest
    name: ✅ All Production Gates Passed
    needs: [typecheck, lint, build, playwright, security, migrations]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" == "failure" || \
                "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.playwright.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" || \
                "${{ needs.migrations.result }}" == "failure" ]]; then
            echo "❌ Production gates failed!"
            exit 1
          fi
          echo "✅ All production gates passed!"
